<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gadget Galley — Clever kitchen finds & home-cooking ideas</title>
<meta name="description" content="The Gadget Galley curates clever kitchen gadgets, small-space organization ideas and home-cooking gear. Find us on Pinterest.">
<style>
  :root {
    --cream: #FAF4E6;
    --navy: #1E3247;
    --copper: #C26A3D;
    --muted: #6E6152;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--cream);
    color: var(--navy);
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4rem 1.5rem;
  }
  .logo {
    width: 108px;
    height: 108px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 2rem;
  }
  h1 {
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 400;
    letter-spacing: 0.01em;
    margin-bottom: 1rem;
  }
  .tagline {
    font-size: 1.125rem;
    color: var(--muted);
    max-width: 34ch;
    line-height: 1.6;
    margin-bottom: 2.5rem;
  }
  .pin-link {
    display: inline-block;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.9375rem;
    letter-spacing: 0.02em;
    color: var(--cream);
    background: var(--copper);
    text-decoration: none;
    padding: 0.8rem 1.6rem;
    border-radius: 999px;
  }
  .pin-link:hover { background: #A9552E; }
  footer {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.8125rem;
    color: var(--muted);
    text-align: center;
    padding: 1.5rem;
    line-height: 1.7;
  }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="The Gadget Galley — steaming copper pot logo" width="108" height="108">
  <h1>The Gadget Galley</h1>
  <p class="tagline">Clever kitchen finds, small-space organization &amp; home-cooking ideas — tested picks, no fluff.</p>
  <a class="pin-link" href="https://www.pinterest.com/thegadgetgalley/">Follow on Pinterest</a>
</main>
<footer>
  <p>As an Amazon Associate we earn from qualifying purchases.</p>
  <p><a href="privacy.html">Privacy policy</a> · © 2026 The Gadget Galley</p>
</footer>
</body>
</html>
